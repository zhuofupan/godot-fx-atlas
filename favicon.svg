<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Godot FX Atlas">
  <defs>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63f3ff"/>
      <stop offset="1" stop-color="#b7ffeb"/>
    </linearGradient>
  </defs>
  <!-- 站点图标：圆角菱形 + 深色 FX（四页 favicon 与牌子图标共用这一个文件）。
       - 圆角给得大（rx≈边长的 28%），小尺寸下才会呈现参考图那种饱满的花瓣轮廓；
       - FX 用描边画、笔画粗，缩到 16px 仍读得出，也不依赖字体（写 <text> 会因缺字体变空白）；
       - ⚠️ 图标自身是 45° 旋转。站内旧样式 `.brand-mark{transform:rotate(45deg)}` 会和它**叠加**，
         净转 90° 就变回方块 —— site-shell.css 里必须 `transform:none` 把它重置掉。 -->
  <rect x="4.4" y="4.4" width="15.2" height="15.2" rx="4.3"
        transform="rotate(45 12 12)" fill="url(#fx)"/>
  <g fill="none" stroke="#061017" stroke-width="2.6" stroke-linecap="square">
    <path d="M8.1 7.9 V 16.1"/>
    <path d="M8.1 7.9 H 12.4"/>
    <path d="M8.1 12 H 11.1"/>
    <path d="M12.8 7.9 L 16.4 16.1"/>
    <path d="M16.4 7.9 L 12.8 16.1"/>
  </g>
</svg>
