<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Godot FX Atlas">
  <defs>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63f3ff"/>
      <stop offset="1" stop-color="#b7ffeb"/>
    </linearGradient>
  </defs>
  <!-- 造型对齐站内 .brand-mark：圆角方块 + 青色渐变 + 深色 FX。
       站点图标与牌子图标共用这一个文件，两处不会画成两个样。 -->
  <rect x="2" y="2" width="20" height="20" rx="6.4" fill="url(#fx)"/>
  <!-- FX 用描边画，不依赖字体：favicon 按 16px 渲染，字体缺失就成空白 -->
  <g fill="none" stroke="#061017" stroke-width="2.1" stroke-linecap="square">
    <path d="M8.4 7.7 V 16.3"/>
    <path d="M8.4 7.7 H 14.4"/>
    <path d="M8.4 12 H 12.4"/>
    <path d="M12.5 7.7 L 17.4 16.3"/>
    <path d="M17.4 7.7 L 12.5 16.3"/>
  </g>
</svg>
