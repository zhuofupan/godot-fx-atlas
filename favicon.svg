<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Godot FX Atlas">
  <defs>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63f3ff"/>
      <stop offset="1" stop-color="#b7ffeb"/>
    </linearGradient>
  </defs>
  <!-- 站点图标：圆角菱形 + 深色 FX（favicon 与牌子图标共用这一个文件）。

       以下是**照着参考图量出来的**，不是估的（量的是菱形竖直中心行）：
         · 菱形对角 ≈ 21.5/24，圆角 rx ≈ 边长的 28%（小尺寸下轮廓才呈饱满花瓣状）；
         · 笔画宽 ≈ 菱形宽的 0.083；
         · 字母左右青色余量 ≈ 0.17 / 0.36（字母略偏左）。
       前两版分别错在：FX 只占 40% 显得又小又空；以及笔画粗到 0.13 直接把菱形盖住。

       FX 全部用描边画：写 <text> 的话 favicon 在 16px 下缺字体就成了空白。
       ⚠️ 图标自身是 45° 旋转；站内旧样式里的 `.brand-mark` 也带 45° 旋转，
          两者**叠加**会变成净转 90°（菱形变回方块）—— site-shell.css 必须 `transform:none` 重置。 -->
  <rect x="4.4" y="4.4" width="15.2" height="15.2" rx="4.3"
        transform="rotate(45 12 12)" fill="url(#fx)"/>
  <!-- ⚠️ 字是**上下颠倒 + 整体斜 15°**的，而且**左右顺序没变**（倒 F 在左、X 在右）。
       所以不能用一个 rotate(180) 解决 —— 那是"整体转 180°"，会把 F 转到右边去。
       正确做法是：先对整组做**垂直翻转**（保持左右顺序、每个字上下颠倒），再整体斜 15°。

       这个朝向是**照参考图定的**，方法是扫组合找最优：
         「垂直翻转 + 15°」差异 74.6，「不翻转 + 180°」75.1，「不翻转 0°」78.3。
       （单看 175/180/0 三个角度差异只差 0.3，靠单个角度分辨不出来 —— 得同时扫翻转。）
       ⚠️ 这是有意的设计，不要"顺手纠正"成正的 FX。 -->
  <g transform="rotate(15 12 12)">
    <g transform="translate(0 24) scale(1 -1)">
      <g fill="none" stroke="#061017" stroke-width="1.85" stroke-linecap="square">
        <!-- F：竖笔**不通高**（下端比 X 收得早），否则在菱形收窄处会顶出边界 -->
        <path d="M7.2 8.8 V 15.5"/>
        <path d="M7.2 8.8 H 12.9"/>
        <path d="M7.2 12.05 H 11.2"/>
        <!-- X：左上臂与 F 的顶横交叠，形成咬合 -->
        <path d="M12.4 7.8 L 16.4 16.4"/>
        <path d="M16.4 7.8 L 12.4 16.4"/>
      </g>
    </g>
  </g>
</svg>
