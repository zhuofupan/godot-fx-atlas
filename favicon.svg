<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" role="img" aria-label="Godot FX Atlas">
  <defs>
    <linearGradient id="fx" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#63f3ff"/>
      <stop offset="1" stop-color="#b7ffeb"/>
    </linearGradient>
  </defs>
  <!-- 站点图标：圆角菱形 + 深色 FX（favicon 与牌子图标共用这一个文件）。

       以下是**照着参考图量出来的**，不是估的（量的是菱形竖直中心行）：
         · 菱形对角 ≈ 21.5/24，圆角 rx ≈ 边长的 28%（小尺寸下轮廓才呈饱满花瓣状）；
         · 笔画宽 ≈ 菱形宽的 0.083；
         · 字母左右青色余量 ≈ 0.17 / 0.36（字母略偏左）。
       前两版分别错在：FX 只占 40% 显得又小又空；以及笔画粗到 0.13 直接把菱形盖住。

       FX 全部用描边画：写 <text> 的话 favicon 在 16px 下缺字体就成了空白。
       ⚠️ 图标自身是 45° 旋转；站内旧样式里的 `.brand-mark` 也带 45° 旋转，
          两者**叠加**会变成净转 90°（菱形变回方块）—— site-shell.css 必须 `transform:none` 重置。 -->
  <rect x="4.4" y="4.4" width="15.2" height="15.2" rx="4.3"
        transform="rotate(45 12 12)" fill="url(#fx)"/>
  <!-- ⚠️ 文字整体**顺时针旋转 45°**（SVG 正角即顺时针）。
       这个朝向是照参考图定的，别"顺手纠正"成正的 FX。

       走过的弯路（留个记录，省得再试）：
         · 不加旋转（正的 FX）—— 与参考图不符；
         · rotate(180) 整体转半圈 —— **会把 F 甩到右边**，但参考图里 F 仍在左；
         · 垂直翻转 + 斜 15° —— 结构对了但仍不是最终要求。
       最终就是 rotate(45)（顺时针）。 -->
  <!-- 字形用**真字体** Times New Roman（非斜体、加粗），不再用描边手画。
       之前手画是为了防"字体缺失→只剩空白"，但需求明确要这个字体，
       而 Times New Roman 是 Windows 自带、必然存在，所以改用 <text>。
       仍保留 `serif` 兜底：万一字体缺失，退化成衬线体而不是无衬线。

       四层变换（顺序即从外到内，每层都在它该在的坐标系里）：
         ① translate  = 屏幕方向的"往左下挪"（必须在旋转之外）
         ② scale(.9 .76) = 整体缩 10% + 字高压到 76%（"扁"同样要是屏幕方向）
         ③ rotate(49)  = 顺时针；45° 对齐菱形 + 额外的 4°
       ⚠️ 若把 ② 放进 rotate 里面，"压扁"就变成沿 49° 方向压，字会歪。 -->
  <g transform="translate(-0.45 0.55)"><g transform="translate(12 12) scale(.9 .76) translate(-12 -12)"><g transform="rotate(49 12 12)">
    <text x="12" y="12" text-anchor="middle" dominant-baseline="central"
          font-family="'Times New Roman', Times, serif" font-size="7"
          font-weight="700" font-style="normal" fill="#061017">FX</text>
  </g></g></g>
</svg>
